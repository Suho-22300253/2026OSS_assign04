<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout Form CSS</title>


    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">


    <!-- Internal CSS -->
    <style>
        body {
            background-color: #f8f9fa;
        }


        .checkout-container {

            max-width: 900px;
            margin: 50px auto;
            padding: 40px;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 10px;

        }


        h1 {
            color: #212529;
            margin-bottom: 20px;
        }


        .form-title {
            margin-top: 30px;
            margin-bottom: 20px;
        }


        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }


        input,
        select,
        textarea {

            margin-bottom: 15px;

        }


        input:focus,
        select:focus,
        textarea:focus {

            border-color: #0d6efd;

            outline: none;

        }


        .payment-box {
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-top: 20px;
        }


        .submit-btn {
            width: 100%;
            padding: 12px;
            margin-top: 30px;
        }

        .submit-btn:hover {
            background-color: #333;
        }
    </style>


</head>


<body>


    <div class="checkout-container">


        <img src="https://getbootstrap.com/docs/5.3/assets/brand/bootstrap-logo.svg" class="img-fluid d-block mx-auto"
            width="50">


        <h1 class="text-center">
            Checkout form
        </h1>


        <p class="text-center text-secondary">
            Below is an example form built entirely with Bootstrap’s form controls.
            Each required form group has a validation state.
        </p>



        <form id="checkoutForm" novalidate>

            <h2 class="form-title">
                Billing address
            </h2>

            <div class="row">

                <div class="col-md-6">

                    <label for="firstName">
                        First name
                    </label>

                    <input class="form-control" type="text" id="firstName" name="firstName" required>

                </div>

                <div class="col-md-6">

                    <label for="lastName">
                        Last name
                    </label>

                    <input class="form-control" type="text" id="lastName" name="lastName" required>

                </div>

            </div>


            <label for="username">
                Username
            </label>


            <div class="input-group mb-3">

                <input class="form-control" type="text" id="username" name="username" minlength="5" required>
            </div>


            <label for="email">
                Email (Optional)
            </label>


            <input class="form-control" type="email" id="email" name="email" placeholder="you@example.com" required>


            <label for="address">
                Address
            </label>


            <input class="form-control" type="text" id="address" name="address" placeholder="1234 Main St" required>


            <label for="address2">
                Address 2 (Optional)
            </label>


            <input class="form-control" type="text" id="address2" name="address2" placeholder="Apartment or suite">


            <div class="row">

                <div class="col-md-5">

                    <label for="country">
                        Country
                    </label>

                    <select class="form-select" id="country" name="country" required>

                        <option value="">Choose...</option>
                        <option value="usa">United States</option>
                        <option value="korea">Korea</option> <!--country.value 를 통해 korea usa를 받을 수 있음-->

                    </select>

                </div>

                <div class="col-md-4">


                    <label for="state">
                        State
                    </label>

                    <select class="form-select" id="state" name="state" required>

                        <option value="">Choose...</option>

                    </select>

                </div>

                <div class="col-md-3">

                    <label for="zip">
                        Zip
                    </label>

                    <input class="form-control" type="text" id="zip" name="zip">

                </div>

            </div>


            <label for="orderNote">
                Delivery Instructions
            </label>


            <textarea class="form-control" id="orderNote" name="orderNote" rows="5"
                placeholder="Enter any special requests.">
            </textarea>

            <hr>

            <div class="form-check">

                <input class="form-check-input" type="checkbox" id="sameAddress" name="sameAddress">

                <label class="form-check-label" for="sameAddress">
                    Shipping address is the same as my billing address
                </label>

            </div>

            <div class="form-check">

                <input class="form-check-input" type="checkbox" id="saveInfo" name="saveInfo">

                <label class="form-check-label" for="saveInfo">
                    Save this information for next time
                </label>

            </div>

            <hr>


            <h2 class="form-title">
                Payment
            </h2>

            <div class="payment-box">

                <div class="form-check">

                    <input class="form-check-input" type="radio" id="credit" name="paymentMethod" checked>

                    <label class="form-check-label" for="credit">
                        Credit card
                    </label>

                </div>

                <div class="form-check">

                    <input class="form-check-input" type="radio" id="debit" name="paymentMethod">

                    <label class="form-check-label" for="debit">
                        Debit card
                    </label>

                </div>

                <div class="form-check">

                    <input class="form-check-input" type="radio" id="paypal" name="paymentMethod">

                    <label class="form-check-label" for="paypal">
                        PayPal
                    </label>

                </div>

            </div>


            <div class="row mt-3">

                <div class="col-md-6">

                    <label for="cardName">
                        Name on card
                    </label>

                    <input class="form-control" type="text" id="cardName" name="cardName" required>

                    <small>
                        Full name as displayed on card
                    </small>

                </div>

                <div class="col-md-6">

                    <label for="cardNumber">
                        Credit card number
                    </label>

                    <input class="form-control" type="text" id="cardNumber" name="cardNumber" maxlength="16"
                        minlength="16" required>

                </div>

            </div>

            <div class="row mt-3">

                <div class="col-md-6">

                    <label for="expiration">
                        Expiration
                    </label>

                    <input class="form-control" type="date" id="expiration" name="expiration" required>

                </div>

                <div class="col-md-6">

                    <label for="cvc">
                        CVC
                    </label>

                    <input class="form-control" type="text" id="cvc" name="cvc" pattern="[0-9]{3}" required>

                </div>

            </div>

            <button class="btn btn-primary submit-btn" type="submit">
                Continue to checkout
            </button>

        </form>


    </div>


</body>

</html>

<script>


    const form = document.querySelector("#checkoutForm");


    form.addEventListener("submit", function (event) {

        const email = document.querySelector("#email");

        if (!email.checkValidity()) {

            event.preventDefault();
            alert("유효한 이메일을 입력해주세요.");
            email.focus();
            return;

        }

        const country = document.querySelector("#country");

        if (!country.checkValidity()) {

            event.preventDefault();
            alert("Country를 선택해주세요.");
            country.focus();
            return;

        }


        const state = document.querySelector("#state");

        if (!state.checkValidity()) {

            event.preventDefault();
            alert("State를 선택해주세요.");
            state.focus();
            return;

        }


        const cardNumber = document.querySelector("#cardNumber");

        if (!cardNumber.checkValidity()) {

            event.preventDefault();
            alert("카드번호는 16자리로 입력해주세요.");
            cardNumber.focus();
            return;

        }


        const cvc = document.querySelector("#cvc");

        if (!cvc.checkValidity()) {

            event.preventDefault();
            alert("CVC는 3자리로 입력해주세요.");
            cvc.focus();
            return;

        }

        event.preventDefault();
        alert("등록이 완료되었습니다.");



    });

    const country = document.querySelector("#country");
    const state = document.querySelector("#state");

    country.addEventListener("change", function(){
        if(country.value =="usa"){
            state.innerHTML = `
                <option value="">Choose...</option>
                <option value="california">California</option>
                <option value="texas">Texas</option>
                <option value="newyork">New York</option>
            `;
        }

        if(country.value =="korea"){
            state.innerHTML = `
                <option value="">Choose...</option>
                <option value="seoul">Seoul</option>
                <option value="busan">Busan</option>
                <option value="incheon">Incheon</option>
            `;
        }
    });



</script>
